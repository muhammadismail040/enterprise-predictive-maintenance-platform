name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Build React dashboard
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 ruff pytest

      - name: Lint with ruff
        run: ruff check .

      - name: Lint with flake8
        run: flake8 .

      - name: Run pytest
        run: pytest -q

      - name: Docker build
        run: docker build -t predictive-maintenance-platform .
